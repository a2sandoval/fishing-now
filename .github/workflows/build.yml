name: Build Fishing Now



# Builds both targets unsigned on a macOS runner — proves the code
# compiles. Signed installs happen from Xcode with your Developer account.
on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"


      - name: Build Watch app manually (swiftc)
        run: bash tools/build_watch_manual.sh


      - name: Stage Watch app for the iPhone embed phase
        run: |
          mkdir -p "build/Build/Products/Release-watchos"
          cp -R "watch-build/FishingNowWatch Watch App.app" "build/Build/Products/Release-watchos/"
          ls -la "build/Build/Products/Release-watchos/"


      - name: Build iPhone app (unsigned)
        run: |
          xcodebuild \
            -project FishingNow.xcodeproj \
            -scheme FishingNow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          build


      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FishingNow.app"
          ls -la "$APP_PATH"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          WATCH_APP='watch-build/FishingNowWatch Watch App.app'
          ls -la "$WATCH_APP"
          mkdir -p Payload/FishingNow.app/Watch
          cp -R "$WATCH_APP" Payload/FishingNow.app/Watch/
          zip -qry FishingNow-unsigned.ipa Payload


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: fishing-now-unsigned-ipa
          path: FishingNow-unsigned.ipa
